name: Test

on:
  push:
    branches: [main, tauri-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri::generate_context! needs frontendDist (../dist) to exist at
      # compile time; the Rust tests compile src-tauri without a frontend build.
      - name: Create placeholder frontend dist
        run: mkdir -p dist && printf '<!doctype html><html><body></body></html>' > dist/index.html

      - name: Run workspace tests
        run: cargo test --workspace
