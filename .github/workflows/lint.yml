name: Lint

on:
  push:
    branches: [main, tauri-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types + format)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit, strict)
        run: pnpm typecheck

      - name: Prettier check
        run: pnpm format:check

  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri::generate_context! needs frontendDist (../dist) to exist at
      # compile time; clippy compiles src-tauri without building the frontend.
      - name: Create placeholder frontend dist
        run: mkdir -p dist && printf '<!doctype html><html><body></body></html>' > dist/index.html

      - name: rustfmt check
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
