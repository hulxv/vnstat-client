[package]
name = "vnstat-rs"
version = "0.1.0"
edition = "2021"
description = "Rust library for reading vnStat traffic data and managing the vnstatd daemon"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
